<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scrapbook</title>
  
  <!-- StPageFlip Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@0.7.8/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030508;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(30, 41, 59, 0.5) 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, rgba(15, 23, 42, 0.8) 0%, transparent 50%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Ambient Cosmic Glow */
    .stars-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: 
        radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 100px 150px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 250px 80px, #a855f7, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 350px 280px, #38bdf8, rgba(0,0,0,0));
      background-size: 400px 400px;
      opacity: 0.6;
    }

    /* Book Stage */
    .book-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
      padding: 10px;
    }

    .flipbook {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    .page {
      background-color: #0b0f19;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* Back Cover Styling */
    .back-cover {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #060913 0%, #0d1322 50%, #150d2a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      border-left: 2px solid rgba(255, 255, 255, 0.05);
      position: relative;
    }

    .back-cover-pattern {
      width: 85%;
      height: 90%;
      border: 1px solid rgba(168, 85, 247, 0.15);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      background: rgba(15, 23, 42, 0.3);
    }

    .back-symbol {
      font-size: 2.5rem;
      opacity: 0.8;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="stars-layer"></div>

  <!-- Pure Flipbook Canvas Stage -->
  <div class="book-container">
    <div id="flipbook" class="flipbook">
      
      <!-- Front Cover -->
      <div class="page" data-density="hard">
        <img src="https://i.ibb.co/TfpmcCf/Untitled65-20261014024648.png" alt="Cover" class="page-img">
      </div>

      <!-- Page 1 -->
      <div class="page">
        <img src="https://i.ibb.co/W4B7qbnX/Untitled61-20261014013129.png" alt="Page 1" class="page-img">
      </div>

      <!-- Page 2 -->
      <div class="page">
        <img src="https://i.ibb.co/tpfyWk5k/IMG-7230.png" alt="Page 2" class="page-img">
      </div>

      <!-- Page 3 -->
      <div class="page">
        <img src="https://i.ibb.co/JRdWtz1v/Untitled64-20261014023753.png" alt="Page 3" class="page-img">
      </div>

      <!-- Page 4 (QR / Space Page) -->
      <div class="page">
        <img src="https://i.ibb.co/qYfPrrSm/Untitled67-20261017165553.png" alt="Page 4" class="page-img">
      </div>

      <!-- Back Cover -->
      <div class="page" data-density="hard">
        <div class="back-cover">
          <div class="back-cover-pattern">
            <div class="back-symbol">🌌✨</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Calculate responsive page dimensions
      const isMobile = window.innerWidth < 768;
      
      // Calculate aspect ratio based on screen size
      let pageWidth, pageHeight;

      if (isMobile) {
        pageWidth = Math.min(window.innerWidth * 0.9, 420);
        pageHeight = Math.min(window.innerHeight * 0.85, 620);
      } else {
        pageWidth = Math.min(window.innerWidth * 0.4, 450);
        pageHeight = Math.min(window.innerHeight * 0.88, 680);
      }

      const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
        width: pageWidth,
        height: pageHeight,
        size: 'fixed',
        minWidth: 260,
        maxWidth: 550,
        minHeight: 380,
        maxHeight: 750,
        maxShadowOpacity: 0.8,
        showCover: true,
        mobileScrollSupport: true,
        clickEventForward: true,
        usePortrait: isMobile
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      // Adjust size on orientation change or window resize
      window.addEventListener('resize', () => {
        const mobileCheck = window.innerWidth < 768;
        let newWidth, newHeight;

        if (mobileCheck) {
          newWidth = Math.min(window.innerWidth * 0.9, 420);
          newHeight = Math.min(window.innerHeight * 0.85, 620);
        } else {
          newWidth = Math.min(window.innerWidth * 0.4, 450);
          newHeight = Math.min(window.innerHeight * 0.88, 680);
        }

        pageFlip.updateFromHtml(document.querySelectorAll('.page'));
      });
    });
  </script>
</body>
</html>
