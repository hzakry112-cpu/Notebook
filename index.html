<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Journal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Orbitron:wght@600;800&family=Reenie+Beanie&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #05050d;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 50%);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Background Stars */
    .stars-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 150px 150px, #e2e8f0, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 280px 70px, #a855f7, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 400px 220px, #38bdf8, rgba(0,0,0,0));
      background-size: 500px 500px;
    }

    /* 3D Book Container */
    .book-viewport {
      perspective: 1500px;
      width: 100%;
      max-width: 420px;
      height: 72vh;
      max-height: 620px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
      padding: 10px;
    }

    .book {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(168, 85, 247, 0.2);
      border-radius: 12px;
    }

    /* Individual Page Frame */
    .page {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: left center;
      transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
      transform-style: preserve-3d;
      border-radius: 12px;
      overflow: hidden;
      background-color: #0b0f19;
      backface-visibility: hidden;
      display: none;
    }

    .page.active {
      display: block;
      z-index: 5;
    }

    /* Flip Animations */
    .flip-next-out {
      animation: flipNext 0.75s forwards ease-in-out;
    }

    .flip-prev-out {
      animation: flipPrev 0.75s forwards ease-in-out;
    }

    @keyframes flipNext {
      0% {
        transform: rotateY(0deg);
        opacity: 1;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: rotateY(-180deg);
        opacity: 0;
      }
    }

    @keyframes flipPrev {
      0% {
        transform: rotateY(-180deg);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: rotateY(0deg);
        opacity: 1;
      }
    }

    /* Images styling */
    .page-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #080c14;
      user-select: none;
    }

    /* Custom Back Cover */
    .back-cover {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #0d1322 0%, #151d30 50%, #1e112a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    /* Controls UI */
    .controls {
      z-index: 20;
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px 25px 20px;
    }

    .btn {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 9999px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.92);
      background: rgba(56, 189, 248, 0.2);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.1);
      color: #64748b;
    }

    .page-indicator {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: #a855f7;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(168, 85, 247, 0.2);
    }
  </style>
</head>
<body>

  <div class="stars-bg"></div>

  <!-- Main Viewport -->
  <div class="book-viewport">
    <div class="book" id="book">
      
      <!-- Page 1: Front Cover -->
      <div class="page active" id="page-0">
        <img src="https://i.ibb.co/TfpmcCf/Untitled65-20261014024648.png" alt="Cover" class="page-img">
      </div>

      <!-- Page 2: Intro -->
      <div class="page" id="page-1">
        <img src="https://i.ibb.co/W4B7qbnX/Untitled61-20261014013129.png" alt="Page 1" class="page-img">
      </div>

      <!-- Page 3: Letter -->
      <div class="page" id="page-2">
        <img src="https://i.ibb.co/tpfyWk5k/IMG-7230.png" alt="Page 2" class="page-img">
      </div>

      <!-- Page 4: Wishes -->
      <div class="page" id="page-3">
        <img src="https://i.ibb.co/JRdWtz1v/Untitled64-20261014023753.png" alt="Page 3" class="page-img">
      </div>

      <!-- Page 5: Space QR -->
      <div class="page" id="page-4">
        <img src="https://i.ibb.co/qYfPrrSm/Untitled67-20261017165553.png" alt="Page 4" class="page-img">
      </div>

      <!-- Page 6: Back Cover -->
      <div class="page" id="page-5">
        <div class="back-cover">
          <div class="text-5xl mb-4">🚀✨</div>
          <h2 style="font-family: 'Orbitron';" class="text-xl font-bold text-cyan-300 tracking-wider mb-2">
            THE END
          </h2>
          <p class="text-xs text-slate-300 leading-relaxed mb-6 max-w-xs">
            "To infinity and beyond... May your year be as bright as the galaxy!"
          </p>
          <div class="h-0.5 w-16 bg-gradient-to-r from-transparent via-purple-500 to-transparent mb-4"></div>
          <span style="font-family: 'Reenie Beanie';" class="text-3xl text-purple-300">Made with 🤍</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Navigation Controls -->
  <div class="controls">
    <button class="btn" id="prev-btn" disabled>PREV ◄</button>
    <div class="page-indicator" id="indicator">1 / 6</div>
    <button class="btn" id="next-btn">NEXT ►</button>
  </div>

  <script>
    const totalPages = 6;
    let currentPage = 0;
    let isAnimating = false;

    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const indicator = document.getElementById('indicator');

    function updateControls() {
      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage === totalPages - 1;
      indicator.textContent = `${currentPage + 1} / ${totalPages}`;
    }

    function flipNext() {
      if (currentPage >= totalPages - 1 || isAnimating) return;
      isAnimating = true;

      const currEl = document.getElementById(`page-${currentPage}`);
      const nextEl = document.getElementById(`page-${currentPage + 1}`);

      currEl.classList.add('flip-next-out');

      setTimeout(() => {
        currEl.classList.remove('active', 'flip-next-out');
        nextEl.classList.add('active');
        currentPage++;
        updateControls();
        isAnimating = false;
      }, 700);
    }

    function flipPrev() {
      if (currentPage <= 0 || isAnimating) return;
      isAnimating = true;

      const currEl = document.getElementById(`page-${currentPage}`);
      const prevEl = document.getElementById(`page-${currentPage - 1}`);

      prevEl.classList.add('active', 'flip-prev-out');

      setTimeout(() => {
        currEl.classList.remove('active');
        prevEl.classList.remove('flip-prev-out');
        currentPage--;
        updateControls();
        isAnimating = false;
      }, 700);
    }

    nextBtn.addEventListener('click', flipNext);
    prevBtn.addEventListener('click', flipPrev);

    // Swipe support for mobile
    let touchStartX = 0;
    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    });

    document.addEventListener('touchend', e => {
      let touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 50) flipNext();
      if (touchEndX - touchStartX > 50) flipPrev();
    });
  </script>
</body>
</html>
